# Docker Compose for development
version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-this-secret-key}
      # Use your Neon PostgreSQL connection string
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:pass@host/db?sslmode=require}
    restart: unless-stopped
# To use:
# 1. Copy .env.local to .env (docker-compose reads .env by default)
# 2. Or set environment variables directly:
#    export DATABASE_URL="postgresql://..."
#    export NEXTAUTH_SECRET="your-secret"
# 3. Run: docker-compose up
